name: Build APK

# هذا يعني: شغّل هذا الـ workflow يدوياً عند الطلب
on:
  workflow_dispatch:

jobs:
  build:
    # استخدم حاسوب GitHub الذي يعمل بنظام Ubuntu
    runs-on: ubuntu-latest

    steps:
      # الخطوة 1: تحميل كود المشروع
      - name: Checkout code
        uses: actions/checkout@v4

      # الخطوة 2: تثبيت Java (مطلوب لبناء تطبيقات Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # الخطوة 3: منح صلاحية التشغيل لأداة البناء gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # الخطوة 4: بناء ملف الـ APK (نسخة debug سهلة البناء ولا تحتاج توقيعاً)
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # الخطوة 5: رفع ملف الـ APK إلى Releases
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "APK Build #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
